<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商城前台预览 · WZSteam 游戏商品管理系统</title>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/utilities.css">
</head>
<body class="min-h-screen bg-slate-50 text-gray-900 flex flex-col">
  <header class="sticky top-0 z-30 border-b border-gray-200 bg-white">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 md:px-6 lg:px-8">
      <div class="flex items-center gap-6">
        <a href="/store.html" class="flex items-center gap-2.5">
          <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-blue-600 text-white font-bold shadow-sm">WZ</span>
          <span class="text-base font-semibold tracking-tight text-gray-900">WZSteam 游戏道具商城</span>
        </a>
        <nav class="hidden md:flex items-center gap-4 text-sm font-medium">
          <a href="/store.html" class="text-blue-600">在售商品展厅</a>
          <a href="/index.html" class="text-gray-600 hover:text-blue-600">返回管理后台</a>
          <a href="/categories.html" class="text-gray-600 hover:text-blue-600">分类管理</a>
        </nav>
      </div>

      <div class="flex items-center gap-3">
        <a href="/index.html" class="rounded-lg bg-blue-50 px-3.5 py-1.5 text-xs font-medium text-blue-700 hover:bg-blue-100">
          ⚙️ 管理后台 (<span id="nav-user-name">管理员</span>)
        </a>
        <button id="btn-logout" type="button" class="rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-xs font-medium text-gray-700 hover:bg-gray-50">
          退出
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 px-4 py-8 md:px-6 lg:px-8">
    <div class="mx-auto max-w-7xl">
      <!-- 顶部横幅与搜索 -->
      <div class="rounded-2xl border border-gray-200 bg-white p-6 md:p-8 shadow-sm">
        <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
          <div>
            <span class="inline-flex items-center rounded-full bg-blue-50 px-3 py-1 text-xs font-medium text-blue-700">实时同步 MySQL 商品库</span>
            <h1 class="mt-2 text-2xl md:text-3xl font-bold tracking-tight text-gray-900">精选 Steam 游戏饰品与数字商品</h1>
            <p class="mt-1 text-sm text-gray-600">你在管理后台新增或修改的在售商品，将实时通过 REST 接口在此处展示</p>
          </div>
          <div class="flex gap-2 w-full md:w-80">
            <input id="store-search" type="search" placeholder="搜索饰品名称..."
                   class="w-full rounded-lg border border-gray-300 bg-gray-50 px-3.5 py-2 text-sm text-gray-900 focus:border-blue-500 focus:bg-white focus:outline-none">
            <button id="btn-store-search" type="button" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700 shrink-0">
              搜索
            </button>
          </div>
        </div>

        <!-- 分类筛选胶囊 -->
        <div id="store-cat-tabs" class="mt-6 flex flex-wrap gap-2"></div>
      </div>

      <!-- 商品卡片网格 -->
      <div id="store-grid" class="mt-6 grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>
    </div>
  </main>

  <!-- 商品详情弹窗 -->
  <div id="detail-modal" class="hidden" style="position:fixed;inset:0;z-index:50;background:rgba(15,23,42,0.55);display:none;align-items:center;justify-content:center;padding:16px;">
    <div class="w-full max-w-lg rounded-xl border border-gray-200 bg-white p-6 shadow-lg">
      <div class="flex items-start justify-between gap-4">
        <div class="flex items-center gap-3">
          <span id="detail-emoji" class="flex h-12 w-12 items-center justify-center rounded-xl bg-slate-100 text-2xl">🎮</span>
          <div>
            <h2 id="detail-title" class="text-lg font-bold text-gray-900"></h2>
            <p id="detail-meta" class="text-xs text-gray-500"></p>
          </div>
        </div>
        <button id="btn-close-detail" type="button" class="rounded-lg p-1.5 text-gray-500 hover:bg-gray-100">✕</button>
      </div>
      <div class="mt-4 rounded-lg bg-slate-50 p-4 text-sm text-gray-700 leading-relaxed" id="detail-desc"></div>
      <div class="mt-5 flex items-center justify-between border-t border-gray-200 pt-4">
        <div>
          <span class="text-xs text-gray-500">当前售价</span>
          <p id="detail-price" class="text-2xl font-bold text-blue-600"></p>
        </div>
        <a id="detail-edit-link" href="/index.html" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">
          在后台管理该商品 →
        </a>
      </div>
    </div>
  </div>

  <footer class="border-t border-gray-200 bg-white py-5 text-center text-xs text-gray-500">
    WZSteam 游戏商品信息管理系统 · 前后端数据交互展示页
  </footer>

  <script src="/assets/js/api.js"></script>
  <script>
    (function () {
      let currentCategory = '';
      let itemsCache = [];
      const grid = document.getElementById('store-grid');
      const catTabs = document.getElementById('store-cat-tabs');
      const detailModal = document.getElementById('detail-modal');

      async function init() {
        const user = await WZApi.ensureLoggedIn();
        if (!user) return;
        const cats = await WZApi.request('/api/categories');
        renderCategoryTabs(cats);
        await loadStoreProducts();
      }

      function renderCategoryTabs(cats) {
        const allBtn = `<button type="button" data-cat="" class="cat-tab rounded-lg px-3.5 py-1.5 text-xs font-medium bg-blue-600 text-white">全部在售商品</button>`;
        const others = cats.map(c =>
          `<button type="button" data-cat="${WZApi.escapeHtml(c.id)}" class="cat-tab rounded-lg border border-gray-300 bg-white px-3.5 py-1.5 text-xs font-medium text-gray-700 hover:bg-gray-50">${WZApi.escapeHtml(c.name)}</button>`
        ).join('');
        catTabs.innerHTML = allBtn + others;
      }

      async function loadStoreProducts() {
        const kw = document.getElementById('store-search').value.trim();
        const qs = new URLSearchParams({ status: 'on_sale', pageSize: '50' });
        if (currentCategory) qs.set('category_id', currentCategory);
        if (kw) qs.set('keyword', kw);

        const data = await WZApi.request('/api/products?' + qs.toString());
        itemsCache = data.items || [];

        if (!itemsCache.length) {
          grid.innerHTML = '<div class="col-span-3 rounded-xl border border-gray-200 bg-white p-12 text-center text-sm text-gray-500">暂无匹配的在售商品</div>';
          return;
        }

        grid.innerHTML = itemsCache.map(item => `
          <article class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm flex flex-col justify-between hover:shadow transition-shadow">
            <div>
              <div class="flex items-start justify-between gap-3">
                <span class="flex h-12 w-12 items-center justify-center rounded-xl bg-slate-100 text-2xl">${WZApi.escapeHtml(item.cover_emoji || '🎮')}</span>
                <span class="rounded-full bg-blue-50 px-2.5 py-0.5 text-xs font-medium text-blue-700">${WZApi.escapeHtml(item.category_name || item.game)}</span>
              </div>
              <h3 class="mt-4 text-base font-semibold text-gray-900">${WZApi.escapeHtml(item.title)}</h3>
              <p class="mt-1 text-xs text-gray-500">${WZApi.escapeHtml(item.game)} · ${WZApi.escapeHtml(item.region)} · ${WZApi.escapeHtml(item.wear_level || '标准')}</p>
              <p class="mt-2.5 text-sm text-gray-600 line-clamp-2">${WZApi.escapeHtml(item.summary || item.description)}</p>
            </div>
            <div class="mt-5 flex items-center justify-between border-t border-gray-100 pt-4">
              <div>
                <p class="text-lg font-bold text-gray-900">¥${Number(item.price).toFixed(2)}</p>
                <p class="text-xs text-gray-500">库存 ${item.stock} 件</p>
              </div>
              <button type="button" data-detail="${WZApi.escapeHtml(item.id)}"
                      class="rounded-lg border border-gray-300 bg-white px-3.5 py-1.5 text-xs font-medium text-gray-700 hover:bg-gray-50">
                查看详情
              </button>
            </div>
          </article>
        `).join('');
      }

      catTabs.addEventListener('click', (e) => {
        const btn = e.target.closest('button.cat-tab');
        if (!btn) return;
        currentCategory = btn.dataset.cat || '';
        catTabs.querySelectorAll('button.cat-tab').forEach(b => {
          if ((b.dataset.cat || '') === currentCategory) {
            b.className = 'cat-tab rounded-lg px-3.5 py-1.5 text-xs font-medium bg-blue-600 text-white';
          } else {
            b.className = 'cat-tab rounded-lg border border-gray-300 bg-white px-3.5 py-1.5 text-xs font-medium text-gray-700 hover:bg-gray-50';
          }
        });
        loadStoreProducts();
      });

      document.getElementById('btn-store-search').addEventListener('click', loadStoreProducts);
      document.getElementById('store-search').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') loadStoreProducts();
      });

      grid.addEventListener('click', async (e) => {
        const btn = e.target.closest('button[data-detail]');
        if (!btn) return;
        const item = await WZApi.request('/api/products/' + encodeURIComponent(btn.dataset.detail));
        document.getElementById('detail-emoji').textContent = item.cover_emoji || '🎮';
        document.getElementById('detail-title').textContent = item.title;
        document.getElementById('detail-meta').textContent = `${item.category_name || ''} · ${item.game} · ${item.region} · 稀有度：${item.rarity || '标准'}`;
        document.getElementById('detail-desc').textContent = item.description || item.summary || '暂无详细说明';
        document.getElementById('detail-price').textContent = '¥' + Number(item.price).toFixed(2);
        detailModal.style.display = 'flex';
        detailModal.classList.remove('hidden');
      });

      document.getElementById('btn-close-detail').addEventListener('click', () => {
        detailModal.style.display = 'none';
        detailModal.classList.add('hidden');
      });

      document.getElementById('btn-logout').addEventListener('click', () => WZApi.logout());

      init();
    })();
  </script>
</body>
</html>
