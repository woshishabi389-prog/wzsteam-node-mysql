<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品分类管理 · WZSteam 游戏商品管理系统</title>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/utilities.css">
</head>
<body class="min-h-screen bg-slate-50 text-gray-900">
  <div class="flex min-h-screen">
    <!-- 左侧导航栏 -->
    <aside class="hidden w-64 shrink-0 flex-col border-r border-gray-200 bg-white lg:flex">
      <a href="/index.html" class="flex h-16 items-center gap-2.5 border-b border-gray-100 px-6">
        <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-blue-600 text-white font-bold shadow-sm">WZ</span>
        <div>
          <p class="text-base font-semibold tracking-tight text-gray-900">WZSteam 控制台</p>
          <p class="text-xs text-gray-500">商品信息管理系统</p>
        </div>
      </a>
      <nav class="flex flex-1 flex-col gap-1.5 px-3 py-5" aria-label="主导航">
        <a href="/index.html" class="flex items-center gap-3 rounded-lg px-3.5 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 hover:text-blue-600">
          <span>📦</span>
          <span>商品信息管理</span>
        </a>
        <a href="/categories.html" class="flex items-center gap-3 rounded-lg bg-blue-50 px-3.5 py-2.5 text-sm font-medium text-blue-700" aria-current="page">
          <span>🗂️</span>
          <span>商品分类管理</span>
        </a>
        <a href="/store.html" class="flex items-center gap-3 rounded-lg px-3.5 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 hover:text-blue-600">
          <span>🛍️</span>
          <span>商城前台预览</span>
        </a>
      </nav>
      <div class="border-t border-gray-100 px-4 py-4">
        <p class="text-xs text-gray-400">WZSteam 分类管理模块</p>
      </div>
    </aside>

    <div class="flex min-w-0 flex-1 flex-col">
      <!-- 顶部栏 -->
      <header class="sticky top-0 z-30 flex h-16 items-center justify-between gap-4 border-b border-gray-200 bg-white px-4 md:px-6 lg:px-8">
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-2 lg:hidden">
            <a href="/index.html" class="rounded-lg px-2.5 py-1.5 text-xs font-medium text-gray-600 hover:bg-gray-50">商品管理</a>
            <a href="/categories.html" class="rounded-lg bg-blue-50 px-2.5 py-1.5 text-xs font-medium text-blue-700">分类管理</a>
            <a href="/store.html" class="rounded-lg px-2.5 py-1.5 text-xs font-medium text-gray-600 hover:bg-gray-50">商城预览</a>
          </div>
          <span class="hidden text-sm text-gray-500 lg:inline">当前位置：<strong class="text-gray-900">控制台 / 商品分类管理</strong></span>
        </div>

        <div class="flex items-center gap-3">
          <div class="text-right">
            <p id="nav-user-name" class="text-sm font-medium text-gray-900">加载中...</p>
            <p id="nav-user-email" class="text-xs text-gray-500"></p>
          </div>
          <button id="btn-logout" type="button"
                  class="rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-xs font-medium text-gray-700 shadow-sm hover:bg-gray-50">
            退出登录
          </button>
        </div>
      </header>

      <main class="flex-1 px-4 py-6 md:px-6 lg:px-8">
        <div class="mx-auto max-w-6xl">
          <div class="flex flex-wrap items-center justify-between gap-4">
            <div>
              <h1 class="text-2xl font-semibold tracking-tight text-gray-900">商品分类管理</h1>
              <p class="mt-1 text-sm text-gray-600">维护 MySQL `categories` 表分类结构，支持新增、修改、排序与关联保护删除</p>
            </div>
            <div class="flex items-center gap-2.5">
              <a href="/index.html" class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50">
                ← 返回商品列表
              </a>
              <button id="btn-open-cat-modal" type="button"
                      class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-blue-700">
                ＋ 新增分类
              </button>
            </div>
          </div>

          <section class="mt-6 rounded-xl border border-gray-200 bg-white shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm">
                <thead class="border-b border-gray-200 bg-gray-50 text-xs font-semibold uppercase tracking-wide text-gray-600">
                  <tr>
                    <th class="px-5 py-3.5">分类ID</th>
                    <th class="px-5 py-3.5">分类名称</th>
                    <th class="px-5 py-3.5">URL标识 (slug)</th>
                    <th class="px-5 py-3.5">分类说明</th>
                    <th class="px-4 py-3.5">排序权重</th>
                    <th class="px-4 py-3.5">关联商品数</th>
                    <th class="px-5 py-3.5 text-right">操作</th>
                  </tr>
                </thead>
                <tbody id="cat-table-body" class="divide-y divide-gray-200">
                  <tr>
                    <td colspan="7" class="px-6 py-10 text-center text-gray-500">正在加载分类数据...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <!-- 分类新增/编辑弹窗 -->
  <div id="cat-modal" class="hidden" style="position:fixed;inset:0;z-index:50;background:rgba(15,23,42,0.55);display:none;align-items:center;justify-content:center;padding:16px;">
    <div class="w-full max-w-md rounded-xl border border-gray-200 bg-white shadow-lg overflow-hidden">
      <div class="flex items-center justify-between border-b border-gray-200 px-6 py-4">
        <h2 id="cat-modal-title" class="text-lg font-semibold text-gray-900">新增商品分类</h2>
        <button id="btn-close-cat-modal" type="button" class="rounded-lg p-1.5 text-gray-500 hover:bg-gray-100">✕</button>
      </div>

      <form id="cat-form" class="p-6 space-y-4">
        <input type="hidden" id="cat-id">

        <div>
          <label class="mb-1 block text-xs font-medium text-gray-700">分类名称 *</label>
          <input id="cat-name" type="text" required placeholder="例如：CS2 音乐盒"
                 class="w-full rounded-lg border border-gray-300 bg-gray-50 px-3 py-2 text-sm text-gray-900 focus:border-blue-500 focus:bg-white focus:outline-none">
        </div>

        <div>
          <label class="mb-1 block text-xs font-medium text-gray-700">分类唯一标识 (slug) *</label>
          <input id="cat-slug" type="text" required pattern="[a-z0-9-]+" placeholder="例如：cs2-music-kits"
                 class="w-full rounded-lg border border-gray-300 bg-gray-50 px-3 py-2 text-sm text-gray-900 focus:border-blue-500 focus:bg-white focus:outline-none">
        </div>

        <div>
          <label class="mb-1 block text-xs font-medium text-gray-700">排序权重（数字越小越靠前）</label>
          <input id="cat-sort" type="number" value="10" required
                 class="w-full rounded-lg border border-gray-300 bg-gray-50 px-3 py-2 text-sm text-gray-900 focus:border-blue-500 focus:bg-white focus:outline-none">
        </div>

        <div>
          <label class="mb-1 block text-xs font-medium text-gray-700">分类描述说明</label>
          <textarea id="cat-desc" rows="3" placeholder="简述该分类包含的商品类型..."
                    class="w-full rounded-lg border border-gray-300 bg-gray-50 px-3 py-2 text-sm text-gray-900 focus:border-blue-500 focus:bg-white focus:outline-none"></textarea>
        </div>

        <div class="flex items-center justify-end gap-3 border-t border-gray-200 pt-4">
          <button id="btn-cancel-cat-modal" type="button" class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">取消</button>
          <button type="submit" class="rounded-lg bg-blue-600 px-5 py-2 text-sm font-medium text-white shadow-sm hover:bg-blue-700">保存分类</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script>
    (function () {
      let categories = [];
      const tbody = document.getElementById('cat-table-body');
      const modal = document.getElementById('cat-modal');
      const form = document.getElementById('cat-form');

      async function init() {
        const user = await WZApi.ensureLoggedIn();
        if (!user) return;
        await loadCategories();
      }

      async function loadCategories() {
        try {
          categories = await WZApi.request('/api/categories');
          renderRows();
        } catch (err) {
          tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-8 text-center text-red-600">${WZApi.escapeHtml(err.message)}</td></tr>`;
        }
      }

      function renderRows() {
        if (!categories.length) {
          tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-10 text-center text-gray-500">暂无分类数据</td></tr>';
          return;
        }
        tbody.innerHTML = categories.map(c => `
          <tr class="hover:bg-gray-50">
            <td class="px-5 py-4 font-mono text-xs text-gray-500">${WZApi.escapeHtml(c.id)}</td>
            <td class="px-5 py-4 font-semibold text-gray-900">${WZApi.escapeHtml(c.name)}</td>
            <td class="px-5 py-4 text-gray-600">${WZApi.escapeHtml(c.slug)}</td>
            <td class="px-5 py-4 text-gray-600">${WZApi.escapeHtml(c.description || '-')}</td>
            <td class="px-4 py-4 text-gray-700">${c.sort_order}</td>
            <td class="px-4 py-4">
              <span class="inline-flex items-center rounded-full bg-blue-50 px-2.5 py-0.5 text-xs font-medium text-blue-700">
                ${c.product_count || 0} 件商品
              </span>
            </td>
            <td class="px-5 py-4 text-right">
              <div class="inline-flex items-center gap-2">
                <button type="button" data-action="edit" data-id="${WZApi.escapeHtml(c.id)}"
                        class="rounded-lg border border-gray-300 bg-white px-2.5 py-1.5 text-xs font-medium text-blue-600 hover:bg-blue-50">
                  编辑
                </button>
                <button type="button" data-action="delete" data-id="${WZApi.escapeHtml(c.id)}" data-name="${WZApi.escapeHtml(c.name)}"
                        class="rounded-lg border border-red-200 bg-red-50 px-2.5 py-1.5 text-xs font-medium text-red-600 hover:bg-red-100">
                  删除
                </button>
              </div>
            </td>
          </tr>
        `).join('');
      }

      function openModal(cat = null) {
        document.getElementById('cat-modal-title').textContent = cat ? '编辑商品分类' : '新增商品分类';
        document.getElementById('cat-id').value = cat ? cat.id : '';
        document.getElementById('cat-name').value = cat ? cat.name : '';
        document.getElementById('cat-slug').value = cat ? cat.slug : '';
        document.getElementById('cat-sort').value = cat ? cat.sort_order : 10;
        document.getElementById('cat-desc').value = cat ? (cat.description || '') : '';
        modal.style.display = 'flex';
        modal.classList.remove('hidden');
      }

      function closeModal() {
        modal.style.display = 'none';
        modal.classList.add('hidden');
      }

      document.getElementById('btn-logout').addEventListener('click', () => WZApi.logout());
      document.getElementById('btn-open-cat-modal').addEventListener('click', () => openModal(null));
      document.getElementById('btn-close-cat-modal').addEventListener('click', closeModal);
      document.getElementById('btn-cancel-cat-modal').addEventListener('click', closeModal);

      tbody.addEventListener('click', async (e) => {
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;
        const id = btn.dataset.id;
        if (btn.dataset.action === 'edit') {
          const cat = categories.find(c => c.id === id);
          if (cat) openModal(cat);
        } else if (btn.dataset.action === 'delete') {
          const name = btn.dataset.name || id;
          if (!window.confirm(`确认要删除分类「${name}」吗？`)) return;
          try {
            await WZApi.request(`/api/categories/${encodeURIComponent(id)}`, { method: 'DELETE' });
            WZApi.showToast('分类删除成功');
            await loadCategories();
          } catch (err) {
            WZApi.showToast(err.message, 'error');
          }
        }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('cat-id').value.trim();
        const payload = {
          name: document.getElementById('cat-name').value.trim(),
          slug: document.getElementById('cat-slug').value.trim().toLowerCase(),
          sort_order: parseInt(document.getElementById('cat-sort').value, 10) || 10,
          description: document.getElementById('cat-desc').value.trim()
        };

        try {
          if (id) {
            await WZApi.request(`/api/categories/${encodeURIComponent(id)}`, {
              method: 'PUT',
              body: JSON.stringify(payload)
            });
            WZApi.showToast('分类修改成功');
          } else {
            await WZApi.request('/api/categories', {
              method: 'POST',
              body: JSON.stringify(payload)
            });
            WZApi.showToast('分类新增成功');
          }
          closeModal();
          await loadCategories();
        } catch (err) {
          WZApi.showToast(err.message, 'error');
        }
      });

      init();
    })();
  </script>
</body>
</html>
