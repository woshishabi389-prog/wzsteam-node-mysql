<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户登录 · WZSteam 游戏商品信息管理系统</title>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/utilities.css">
</head>
<body class="min-h-screen bg-slate-50 text-gray-900 flex flex-col justify-between">
  <header class="border-b border-gray-200 bg-white">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 md:px-6 lg:px-8">
      <a href="/login.html" class="flex items-center gap-2.5">
        <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-blue-600 text-white font-bold shadow-sm">WZ</span>
        <div>
          <span class="text-base font-semibold tracking-tight text-gray-900">WZSteam 商品管理系统</span>
          <span class="ml-2 rounded-full bg-blue-50 px-2.5 py-0.5 text-xs font-medium text-blue-700">Node.js + MySQL</span>
        </div>
      </a>
      <div class="flex items-center gap-3 text-sm">
        <span class="text-gray-500">还没有账号？</span>
        <a href="/register.html" class="rounded-lg border border-gray-300 bg-white px-3.5 py-1.5 font-medium text-gray-700 shadow-sm hover:bg-gray-50">立即注册</a>
      </div>
    </div>
  </header>

  <main class="px-4 py-12 md:px-6 md:py-16">
    <div class="mx-auto w-full max-w-md rounded-xl border border-gray-200 bg-white p-6 md:p-8 shadow-sm">
      <div class="flex justify-center">
        <span class="flex h-12 w-12 items-center justify-center rounded-xl bg-blue-600 text-2xl text-white shadow-sm">🎮</span>
      </div>
      <h1 class="mt-5 text-center text-2xl font-semibold tracking-tight text-gray-900">系统登录</h1>
      <p class="mt-2 text-center text-sm text-gray-600">登录 WZSteam 游戏道具与商品信息管理后台</p>

      <div id="login-alert" class="mt-5 hidden rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" role="alert"></div>

      <form id="login-form" class="mt-6 space-y-5">
        <div>
          <label for="email" class="mb-2 block text-sm font-medium text-gray-700">登录邮箱</label>
          <input id="email" name="email" type="email" required autocomplete="email"
                 placeholder="admin@wzsteam.local"
                 class="w-full rounded-lg border border-gray-300 bg-gray-50 px-3.5 py-2.5 text-sm text-gray-900 placeholder:text-gray-400 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label for="password" class="mb-2 block text-sm font-medium text-gray-700">登录密码</label>
          <input id="password" name="password" type="password" required autocomplete="current-password"
                 placeholder="请输入密码"
                 class="w-full rounded-lg border border-gray-300 bg-gray-50 px-3.5 py-2.5 text-sm text-gray-900 placeholder:text-gray-400 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <button id="submit-btn" type="submit"
                class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-medium text-white shadow-sm transition-all duration-150 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
          登录进入系统
        </button>
      </form>

      <div class="mt-6 rounded-lg border border-gray-200 bg-slate-50 p-4">
        <p class="text-xs font-semibold uppercase tracking-wide text-gray-500">内置演示账号（点击一键填充）</p>
        <div class="mt-2.5 flex flex-wrap gap-2">
          <button type="button" id="fill-admin"
                  class="rounded-lg border border-blue-200 bg-blue-50 px-3 py-1.5 text-xs font-medium text-blue-700 hover:bg-blue-100">
            管理员：admin@wzsteam.local
          </button>
          <button type="button" id="fill-demo"
                  class="rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-xs font-medium text-gray-700 hover:bg-gray-50">
            普通用户：demo@wzsteam.local
          </button>
        </div>
      </div>

      <p class="mt-6 text-center text-sm text-gray-600">
        新用户？
        <a href="/register.html" class="font-medium text-blue-600 hover:text-blue-700">点击注册新账号 →</a>
      </p>
    </div>
  </main>

  <footer class="border-t border-gray-200 bg-white py-5 text-center text-xs text-gray-500">
    WZSteam 游戏商品信息管理系统 · 基于 Node.js + Express + MySQL 构建
  </footer>

  <script src="/assets/js/api.js"></script>
  <script>
    (function () {
      const form = document.getElementById('login-form');
      const emailInput = document.getElementById('email');
      const pwdInput = document.getElementById('password');
      const alertBox = document.getElementById('login-alert');
      const submitBtn = document.getElementById('submit-btn');

      document.getElementById('fill-admin').addEventListener('click', () => {
        emailInput.value = 'admin@wzsteam.local';
        pwdInput.value = 'Admin12345!';
        alertBox.classList.add('hidden');
      });

      document.getElementById('fill-demo').addEventListener('click', () => {
        emailInput.value = 'demo@wzsteam.local';
        pwdInput.value = 'Demo12345!';
        alertBox.classList.add('hidden');
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.textContent = '正在验证身份...';

        try {
          const data = await WZApi.request('/api/auth/login', {
            method: 'POST',
            skipAuthRedirect: true,
            body: JSON.stringify({
              email: emailInput.value.trim(),
              password: pwdInput.value
            })
          });
          WZApi.setSession(data.user, data.token);
          WZApi.showToast('登录成功，正在进入商品管理工作台...');
          setTimeout(() => {
            location.href = '/index.html';
          }, 300);
        } catch (err) {
          alertBox.textContent = err.message || '登录失败，请检查账号或密码';
          alertBox.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.textContent = '登录进入系统';
        }
      });
    })();
  </script>
</body>
</html>
