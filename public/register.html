<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户注册 · WZSteam 游戏商品信息管理系统</title>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/utilities.css">
</head>
<body class="min-h-screen bg-slate-50 text-gray-900 flex flex-col justify-between">
  <header class="border-b border-gray-200 bg-white">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 md:px-6 lg:px-8">
      <a href="/login.html" class="flex items-center gap-2.5">
        <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-blue-600 text-white font-bold shadow-sm">WZ</span>
        <div>
          <span class="text-base font-semibold tracking-tight text-gray-900">WZSteam 商品管理系统</span>
          <span class="ml-2 rounded-full bg-blue-50 px-2.5 py-0.5 text-xs font-medium text-blue-700">Node.js + MySQL</span>
        </div>
      </a>
      <div class="flex items-center gap-3 text-sm">
        <span class="text-gray-500">已有账号？</span>
        <a href="/login.html" class="rounded-lg border border-gray-300 bg-white px-3.5 py-1.5 font-medium text-gray-700 shadow-sm hover:bg-gray-50">返回登录</a>
      </div>
    </div>
  </header>

  <main class="px-4 py-12 md:px-6 md:py-16">
    <div class="mx-auto w-full max-w-md rounded-xl border border-gray-200 bg-white p-6 md:p-8 shadow-sm">
      <div class="flex justify-center">
        <span class="flex h-12 w-12 items-center justify-center rounded-xl bg-blue-600 text-2xl text-white shadow-sm">✨</span>
      </div>
      <h1 class="mt-5 text-center text-2xl font-semibold tracking-tight text-gray-900">注册新账号</h1>
      <p class="mt-2 text-center text-sm text-gray-600">创建管理员/操作员账户以管理商品与分类数据</p>

      <div id="reg-alert" class="mt-5 hidden rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" role="alert"></div>

      <form id="register-form" class="mt-6 space-y-4">
        <div>
          <label for="username" class="mb-1.5 block text-sm font-medium text-gray-700">用户名 / 姓名</label>
          <input id="username" name="username" type="text" required minlength="2" maxlength="32"
                 placeholder="例如：张同学"
                 class="w-full rounded-lg border border-gray-300 bg-gray-50 px-3.5 py-2.5 text-sm text-gray-900 placeholder:text-gray-400 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label for="email" class="mb-1.5 block text-sm font-medium text-gray-700">邮箱地址</label>
          <input id="email" name="email" type="email" required autocomplete="email"
                 placeholder="you@example.com"
                 class="w-full rounded-lg border border-gray-300 bg-gray-50 px-3.5 py-2.5 text-sm text-gray-900 placeholder:text-gray-400 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label for="password" class="mb-1.5 block text-sm font-medium text-gray-700">设置密码（至少 6 位）</label>
          <input id="password" name="password" type="password" required minlength="6" autocomplete="new-password"
                 placeholder="请输入至少 6 位密码"
                 class="w-full rounded-lg border border-gray-300 bg-gray-50 px-3.5 py-2.5 text-sm text-gray-900 placeholder:text-gray-400 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label for="confirm_password" class="mb-1.5 block text-sm font-medium text-gray-700">确认密码</label>
          <input id="confirm_password" name="confirm_password" type="password" required minlength="6" autocomplete="new-password"
                 placeholder="请再次输入密码"
                 class="w-full rounded-lg border border-gray-300 bg-gray-50 px-3.5 py-2.5 text-sm text-gray-900 placeholder:text-gray-400 focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <button id="submit-btn" type="submit"
                class="mt-2 inline-flex w-full items-center justify-center gap-2 rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-medium text-white shadow-sm transition-all duration-150 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
          立即注册并登录
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-gray-600">
        已经有账号？
        <a href="/login.html" class="font-medium text-blue-600 hover:text-blue-700">返回登录页 →</a>
      </p>
    </div>
  </main>

  <footer class="border-t border-gray-200 bg-white py-5 text-center text-xs text-gray-500">
    WZSteam 游戏商品信息管理系统 · 基于 Node.js + Express + MySQL 构建
  </footer>

  <script src="/assets/js/api.js"></script>
  <script>
    (function () {
      const form = document.getElementById('register-form');
      const alertBox = document.getElementById('reg-alert');
      const submitBtn = document.getElementById('submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.add('hidden');

        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;

        if (password !== confirmPassword) {
          alertBox.textContent = '两次输入的密码不一致，请重新核对';
          alertBox.classList.remove('hidden');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = '正在创建账号...';

        try {
          const data = await WZApi.request('/api/auth/register', {
            method: 'POST',
            skipAuthRedirect: true,
            body: JSON.stringify({ username, email, password })
          });
          WZApi.setSession(data.user, data.token);
          WZApi.showToast('注册成功！正在进入商品信息管理系统...');
          setTimeout(() => {
            location.href = '/index.html';
          }, 300);
        } catch (err) {
          alertBox.textContent = err.message || '注册失败，请稍后重试';
          alertBox.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.textContent = '立即注册并登录';
        }
      });
    })();
  </script>
</body>
</html>
